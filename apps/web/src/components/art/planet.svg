<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="surface" cx="32%" cy="25%" r="80%">
      <stop stop-color="#c67aeb"/>
      <stop offset=".29" stop-color="#8d39bd"/>
      <stop offset=".57" stop-color="#4f1b77"/>
      <stop offset=".84" stop-color="#250f3d"/>
      <stop offset="1" stop-color="#10091b"/>
    </radialGradient>
    <radialGradient id="highlight" cx="29%" cy="22%" r="50%">
      <stop stop-color="#f7d9ff" stop-opacity=".44"/>
      <stop offset=".7" stop-color="#e4b0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2b4ff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#bc70ed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9752d2" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="bands" width="220" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
